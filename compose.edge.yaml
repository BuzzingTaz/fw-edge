name: fw-edge

services:
  # Base components for ALL edge nodes
  edge_actor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: edge_actor
    container_name: fw-edge-actor
    environment:
      - NATS_URL=nats://10.42.1.100:4222 # Engine NATS url
      - NODE_ID=${NODE_ID:-} # Optional, defaults to hostname
      - HOST_PROJECT_DIR=${PWD}
    command: [ "./service", "-nats-url", "nats://10.42.1.100:4222" ]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Needed to spin up apps
      - .:/root/fw-edge # FIXME: Narrow it down

  resource_monitor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: resource_monitor
    container_name: fw-resource-monitor
    environment:
      - NATS_URL=nats://10.42.1.101:4223 # Within edge NATS url
      - NODE_ID=${NODE_ID:-}
    command: [ "./service", "-nats-url", "nats://10.42.1.101:4223" ]
    restart: unless-stopped
    privileged: true
    volumes:
      # Mount host /proc and /sys to read host metrics correctly from inside the container
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  # Components ONLY for the Main Edge Node (enable via `--profile main`)
  edge_nats:
    image: nats:latest
    container_name: fw-edge-nats
    ports:
      - "4223:4222"
    profiles: [ "main" ]
    restart: unless-stopped

  edge_ingest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: edge_ingest
    container_name: fw-edge-ingest
    environment:
      - EDGE_NATS_URL=nats://edge_nats:4222
      - CENTRAL_NATS_URL=nats://10.42.1.100:4222
    command: [ "./service", "-edge-nats-url", "nats://edge_nats:4222", "-central-nats-url", "nats://10.42.1.100:4222", "-db-path", "/data/telemetry.db" ]
    ports:
      - "8888:8888"
    volumes:
      - ./rt_data/sqlite:/data
      - ./results:/benchmarks
    profiles: [ "main" ]
    depends_on:
      - edge_nats
    restart: unless-stopped
