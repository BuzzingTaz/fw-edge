syntax = "proto3";

option go_package = "github.com/BuzzingTaz/fw-edge-apps/cmd/compute/edge-compute-yolo;pbcompute";


service InferenceTracker {
  rpc StreamResults (stream InferenceResult) returns (Ack) {}
}

message InferenceResult {
  int64 timestamp = 1;
  repeated BoundingBox boxes = 2;
}

message BoundingBox {
  string class_label = 1;
  float confidence = 2;
  int32 x = 3;
  int32 y = 4;
  int32 w = 5;
  int32 h = 6;
}

message Ack {
  bool received = 1;
}
